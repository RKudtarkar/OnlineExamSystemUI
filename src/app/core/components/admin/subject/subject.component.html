<div class="flex justify-end p-5"><button mat-flat-button routerLink="/SubjectAdd" color="primary">Add
    Subject</button></div>
@if(lstSubject.length>0){
    <table mat-table [dataSource]="lstSubject" class="mat-elevation-z3">
        <ng-container matColumnDef="category_name">
            <th mat-header-cell *matHeaderCellDef> Category </th>
            <td mat-cell *matCellDef="let element"> {{element.category_name}} </td>
        </ng-container>
        
        <ng-container matColumnDef="subject_name">
            <th mat-header-cell *matHeaderCellDef> Subject Name </th>
            <td mat-cell *matCellDef="let element"> {{element.subject_name}} </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
}
@else {
<mat-card>
    <mat-card-content>
        <h2>No Subject Created Yet!</h2>
    </mat-card-content>
</mat-card>
}

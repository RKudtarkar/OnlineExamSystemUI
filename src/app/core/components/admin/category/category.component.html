<mat-card>
    <mat-card-header>
        <mat-card-title>category</mat-card-title>
    </mat-card-header>
    <mat-card-content [formGroup]="newCategory">
        <mat-form-field color="accent">
            <mat-label>Category</mat-label>
            <input matInput formControlName="categoryId">
        </mat-form-field>
        <mat-form-field color="accent">
            <mat-label>SubCategory</mat-label>
            <input matInput formControlName="categoryName">
        </mat-form-field>
        <button mat-stroked-button color="accent" (click)="addNewCategory()">save</button>

        <div class="flex justify-end p-5">
            <button mat-flat-button routerLink="../CategoryList" color="primary">
                back to Employee list</button>
        </div>
    </mat-card-content>
</mat-card>
